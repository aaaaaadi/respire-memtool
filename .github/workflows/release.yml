name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
            artifact: windows
          - os: macos-latest
            bundles: app,dmg
            artifact: macos
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            build-essential \
            libssl-dev \
            libxdo-dev

      - run: npm ci

      - run: npm test

      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-assets

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/memtools.exe "release-assets/memtools-$VERSION.exe"
          fi

          find src-tauri/target/release/bundle -type f \
            \( -iname '*.msi' -o -iname '*setup.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.AppImage' \) \
            -exec cp {} release-assets/ \;

          ls -l release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi

          EXE="release-assets/memtools-$VERSION.exe"
          test -f "$EXE"
          SHA="$(sha256sum "$EXE" | awk '{print $1}')"
          SIZE="$(stat -c%s "$EXE")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_URL="https://github.com/risense-ai/respire-memtool/releases/tag/v$VERSION"

          cat > release-assets/update.json <<EOF
          {
            "version": "$VERSION",
            "notes": "See $RELEASE_URL",
            "pub_date": "$PUB_DATE",
            "url": "https://github.com/risense-ai/respire-memtool/releases/download/v$VERSION/memtools-$VERSION.exe",
            "sha256": "$SHA",
            "size": $SIZE,
            "mandatory": false
          }
          EOF

          jq . release-assets/update.json

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" --title "memTools $TAG" --generate-notes release-assets/*
          fi
